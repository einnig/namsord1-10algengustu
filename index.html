<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Námsorð: 1 - 10 algengustu.</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Námsorð: 1 - 10 algengustu.</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="lang-selector">
        <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
        <select id="languageSelect" onchange="updateUI()">
            <option value="ar">Arabíska – العربية</option>
            <option value="da">Danska – Dansk</option>
            <option value="en" selected>Enska – English</option>
            <option value="tl">Filippseyska – Tagalog / Filipino</option>
            <option value="fr">Franska – Français</option>
            <option value="zh">Kínverska – 中文</option>
            <option value="lv">Lettneska – Latviešu</option>
            <option value="lt">Litháíska – Lietuvių</option>
            <option value="no">Norska – Norsk</option>
            <option value="fa">Persneska – فارسی</option>
            <option value="pt">Portúgalska – Português</option>
            <option value="pl">Pólska – Polski</option>
            <option value="ro">Rúmenska – Română</option>
            <option value="ru">Rússneska – Русский</option>
            <option value="es">Spænska – Español</option>
            <option value="sv">Sænska – Svenska</option>
            <option value="th">Tælenska – ภาษาไทย</option>
            <option value="uk">Úkraínska – Українська</option>
            <option value="vi">Víetnamska – Tiếng Việt</option>
            <option value="de">Þýska – Deutsch</option>
        </select>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "einnig", 
        is_exp: "<b>Útskýring:</b> Líka, til viðbótar.<br><b>Samheiti:</b> líka, auk þess.<br><b>Dæmi:</b> Hún ætlar <b>einnig</b> að koma.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> <b>الشرح:</b> أيضاً، بالإضافة إلى شيء آخر. <b>مرادف:</b> كذلك. <b>مثال:</b> هي <b>أيضاً</b> ستأتي.</div>",
            "da": "<b>Danska (Dansk):</b> <b>Forklaring:</b> Også, i tillæg. <b>Synonym:</b> desuden. <b>Eksempel:</b> Hun har <b>også</b> tænkt sig at komme.",
            "en": "<b>Enska (English):</b> <b>Explanation:</b> Also, in addition. <b>Synonym:</b> as well. <b>Example:</b> She is <b>also</b> going to come.",
            "tl": "<b>Filippseyska (Tagalog):</b> <b>Paliwanag:</b> Rin/din, bukod pa rito. <b>Kasingkahulugan:</b> pati. <b>Halimbawa:</b> Pupunta <b>rin</b> siya.",
            "fr": "<b>Franska (Français):</b> <b>Explication:</b> Aussi, de plus. <b>Synonyme:</b> également. <b>Exemple:</b> Elle va <b>aussi</b> venir.",
            "zh": "<b>Kínverska (中文):</b> <b>解释：</b> 也，此外。 <b>同义词：</b> 同样。 <b>例句：</b> 她<b>也</b>要来。",
            "lv": "<b>Lettneska (Latviešu):</b> <b>Paskaidrojums:</b> Arī, turklāt. <b>Sinonīms:</b> tāpat. <b>Piemērs:</b> Viņa <b>arī</b> ieradīsies.",
            "lt": "<b>Litháíska (Lietuvių):</b> <b>Paaiškinimas:</b> Taip pat, be to. <b>Sinonimas:</b> be to. <b>Pavyzdys:</b> Ji <b>taip pat</b> ateis.",
            "no": "<b>Norska (Norsk):</b> <b>Forklaring:</b> Også, i tillegg. <b>Synonym:</b> dessuten. <b>Eksempel:</b> Hun har <b>også</b> tenkt å komme.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> <b>توضیح:</b> همچنین، علاوه بر این. <b>مترادف:</b> نیز. <b>مثال:</b> او <b>همچنین</b> می‌آید.</div>",
            "pt": "<b>Portúgalska (Português):</b> <b>Explicação:</b> Também, além disso. <b>Sinônimo:</b> igualmente. <b>Exemplo:</b> Ela <b>também</b> vai vir.",
            "pl": "<b>Pólska (Polski):</b> <b>Wyjaśnienie:</b> Również, ponadto. <b>Synonim:</b> także. <b>Przykład:</b> Ona <b>również</b> zamierza przyjść.",
            "ro": "<b>Rúmenska (Română):</b> <b>Explicație:</b> De asemenea, în plus. <b>Sinonim:</b> totodată. <b>Exemplu:</b> Ea va veni <b>de asemenea</b>.",
            "ru": "<b>Rússneska (Русский):</b> <b>Объяснение:</b> Также, кроме того. <b>Синоним:</b> тоже. <b>Пример:</b> Она <b>также</b> придет.",
            "es": "<b>Spænska (Español):</b> <b>Explicación:</b> También, además. <b>Sinónimo:</b> igualmente. <b>Ejemplo:</b> Ella <b>también</b> va a venir.",
            "sv": "<b>Sænska (Svenska):</b> <b>Förklaring:</b> Också, dessutom. <b>Synonym:</b> likaledes. <b>Exempel:</b> Hon ska <b>också</b> komma.",
            "th": "<b>Tælenska (ภาษาไทย):</b> <b>คำอธิบาย:</b> ด้วย, นอกจากนี้ <b>คำพ้องความหมาย:</b> เช่นกัน <b>ตัวอย่าง:</b> เธอจะมา<b>ด้วย</b>",
            "uk": "<b>Úkraínska (Українська):</b> <b>Пояснення:</b> Також, крім того. <b>Синонім:</b> теж. <b>Приклад:</b> Вона <b>також</b> прийде.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> <b>Giải thích:</b> Cũng, ngoài ra. <b>Từ đồng nghĩa:</b> cũng vậy. <b>Ví dụ:</b> Cô ấy <b>cũng</b> sẽ đến.",
            "de": "<b>Þýska (Deutsch):</b> <b>Erklärung:</b> Auch, zusätzlich. <b>Synonym:</b> ebenfalls. <b>Beispiel:</b> Sie wird <b>auch</b> kommen."
        }
    },
    { 
        text: "hluti", 
        is_exp: "<b>Útskýring:</b> Nafnorð sem þýðir partur af einhverri heild. Gott er að rugla því ekki saman við fleirtöluna af orðinu 'hlutur' (margir hlutir/dót).<br><b>Samheiti:</b> partur, brot.<br><b>Dæmi:</b> Þetta er mikilvægur <b>hluti</b> af verkinu.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> <b>الشرح:</b> اسم يعني جزء من كل. لا تخلط بينه وبين صيغة الجمع لكلمة 'أشياء'. <b>مرادف:</b> جزء. <b>مثال:</b> هذا <b>جزء</b> مهم من العمل.</div>",
            "da": "<b>Danska (Dansk):</b> <b>Forklaring:</b> Navneord der betyder en part af en helhed. Skal ikke forveksles med flertal af 'ting'. <b>Synonym:</b> del. <b>Eksempel:</b> Dette er en vigtig <b>del</b> af arbejdet.",
            "en": "<b>Enska (English):</b> <b>Explanation:</b> A noun meaning a part or portion of a whole. Not to be confused with the plural of 'hlutur' (things). <b>Synonym:</b> part. <b>Example:</b> This is an important <b>part</b> of the work.",
            "tl": "<b>Filippseyska (Tagalog):</b> <b>Paliwanag:</b> Pangngalan na nangangahulugang bahagi ng isang kabuuan. Huwag ipagkamali sa maramihan ng 'bagay'. <b>Kasingkahulugan:</b> parte. <b>Halimbawa:</b> Ito ay isang mahalagang <b>bahagi</b> ng trabaho.",

            "lt": "<b>Litháíska (Lietuvių):</b> <b>Paaiškinimas:</b> Daiktavardis, reiškiantis visumos dalį. Nepainioti su žodžio 'daiktai' daugiskaita. <b>Sinonimas:</b> dalis. <b>Pavyzdys:</b> Tai svarbi darbo <b>dalis</b>.",
            "no": "<b>Norska (Norsk):</b> <b>Forklaring:</b> Substantiv som betyr en del av en helhet. Må ikke forveksles med flertall av 'ting'. <b>Synonym:</b> del. <b>Eksempel:</b> Dette er en viktig <b>del</b> av arbeidet.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> <b>توضیح:</b> اسمی به معنی بخشی از یک کل. نباید با جمع کلمه «اشیاء» اشتباه گرفته شود. <b>مترادف:</b> قسمت/بخش. <b>مثال:</b> این <b>بخش</b> مهمی از کار است.</div>",
            "pt": "<b>Portúgalska (Português):</b> <b>Explicação:</b> Substantivo que significa uma parte de um todo. Não confundir com o plural de 'coisas'. <b>Sinônimo:</b> parte. <b>Exemplo:</b> Esta é uma <b>parte</b> importante do trabalho.",
            "pl": "<b>Pólska (Polski):</b> <b>Wyjaśnienie:</b> Rzeczownik oznaczający część całości. Nie mylić z liczbą mnogą słowa 'rzeczy'. <b>Synonim:</b> część. <b>Przykład:</b> To jest ważna <b>część</b> pracy.",
            "ro": "<b>Rúmenska (Română):</b> <b>Explicație:</b> Substantiv care înseamnă o parte dintr-un întreg. A nu se confunda cu pluralul pentru 'lucruri'. <b>Sinonim:</b> parte. <b>Exemplu:</b> Aceasta este o <b>parte</b> importantă a muncii.",
            "ru": "<b>Rússneska (Русский):</b> <b>Объяснение:</b> Существительное, означающее часть целого. Не путать с множественным числом слова 'вещи'. <b>Синоним:</b> часть. <b>Пример:</b> Это важная <b>часть</b> работы.",
            "es": "<b>Spænska (Español):</b> <b>Explicación:</b> Sustantivo que significa una parte de un todo. No confundir con el plural de 'cosas'. <b>Sinónimo:</b> parte. <b>Ejemplo:</b> Esta es una <b>parte</b> importante del trabajo.",

            "th": "<b>Tælenska (ภาษาไทย):</b> <b>คำอธิบาย:</b> คำนามที่หมายถึงส่วนหนึ่งของทั้งหมด อย่าสับสนกับรูปพหูพจน์ของคำว่า 'สิ่งของ' <b>คำพ้องความหมาย:</b> ส่วน <b>ตัวอย่าง:</b> นี่คือ<b>ส่วน</b>สำคัญของงาน",
            "uk": "<b>Úkraínska (Українська):</b> <b>Пояснення:</b> Іменник, що означає частину цілого. Не плутати з множиною слова 'речі'. <b>Синонім:</b> частина. <b>Приклад:</b> Це важлива <b>частина</b> роботи.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> <b>Giải thích:</b> Một danh từ có nghĩa là một phần của tổng thể. Không nhầm lẫn với số nhiều của từ 'những thứ/đồ vật'. <b>Từ đồng nghĩa:</b> phần. <b>Ví dụ:</b> Đây là một <b>phần</b> quan trọng của công việc.",
            "de": "<b>Þýska (Deutsch):</b> <b>Erklärung:</b> Ein Nomen, das einen Teil eines Ganzen bedeutet. Nicht mit dem Plural von 'Dingen' zu verwechseln. <b>Synonym:</b> Teil/Abschnitt. <b>Beispiel:</b> Dies ist ein wichtiger <b>Teil</b> der Arbeit."

    {

        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> <b>الشرح:</b> عندما يغير شيء ما شيئاً آخر. غالباً ما تستخدم في صيغة الجمع. <b>مرادف:</b> تأثير. <b>مثال:</b> الطقس له <b>تأثير</b> كبير علي.</div>",

            "fr": "<b>Franska (Français):</b> <b>Explication:</b> Quand quelque chose change une autre chose. Le mot est souvent au pluriel. <b>Synonyme:</b> impact. <b>Exemple:</b> La météo a un grand <b>effet</b> sur moi.",
            "zh": "<b>Kínverska (中文):</b> <b>解释：</b> 当某事物改变另一事物时。该词通常以复数形式出现。 <b>同义词：</b> 影响。 <b>例句：</b> 天气对我<b>影响</b>很大。",
            "lv": "<b>Lettneska (Latviešu):</b> <b>Paskaidrojums:</b> Kad kaut kas maina kaut ko citu. <b>Sinonīms:</b> ietekme. <b>Piemērs:</b> Laikapstākļiem ir liela <b>ietekme</b> uz mani.",

            "no": "<b>Norska (Norsk):</b> <b>Forklaring:</b> Når noe endrer noe annet. Brukes oftest i flertall på islandsk. <b>Synonym:</b> virkning. <b>Eksempel:</b> Været har stor <b>innflytelse (effekt)</b> på meg.",

            "da": "<b>Danska (Dansk):</b> <b>Forklaring:</b> Har flere betydninger. Kan være udsagnsord i nutid (at holde noget, eller at tænke) og kan være et bindeord (men derimod). Her betyder det at tro. <b>Synonym:</b> tror. <b>Eksempel:</b> Han <b>tror</b>, at det regner i morgen.",
            "en": "<b>Enska (English):</b> <b>Explanation:</b> Can have multiple meanings. It can be a present tense verb (to hold, or to think/believe) and it can be a conjunction ('but rather'). Here it means to think. <b>Synonym:</b> believes/thinks. <b>Example:</b> He <b>thinks</b> it will rain tomorrow.",
            "tl": "<b>Filippseyska (Tagalog):</b> <b>Paliwanag:</b> Maaaring magkaroon ng maraming kahulugan. Maaaring pandiwa (hawakan, o isipin) at maaari itong pangatnig ('kundi/sa halip'). Dito, ito ay mag-isip. <b>Kasingkahulugan:</b> naniniwala. <b>Halimbawa:</b> <b>Iniisip</b> niya na uulan bukas.",
            "fr": "<b>Franska (Français):</b> <b>Explication:</b> Peut avoir plusieurs sens. Peut être un verbe au présent (tenir, ou penser) ou une conjonction ('mais plutôt'). Ici, cela signifie penser. <b>Synonyme:</b> croit/pense. <b>Exemple:</b> Il <b>pense</b> qu'il pleuvra demain.",
            "zh": "<b>Kínverska (中文):</b> <b>解释：</b> 可以有多种含义。可以是现在时动词（拿，或认为），也可以是连词（“而是”）。在这里意思是认为。 <b>同义词：</b> 认为 / 相信。 <b>例句：</b> 他<b>认为</b>明天会下雨。",
            "lv": "<b>Lettneska (Latviešu):</b> <b>Paskaidrojums:</b> Var būt vairākas nozīmes. Tas var būt darbības vārds tagadnē (turēt vai domāt), vai saiklis ('bet drīzāk'). Šeit tas nozīmē domāt. <b>Sinonīms:</b> uzskata/domā. <b>Piemērs:</b> Viņš <b>domā</b>, ka rīt līs.",
            "lt": "<b>Litháíska (Lietuvių):</b> <b>Paaiškinimas:</b> Gali turėti kelias reikšmes. Tai gali būti esamojo laiko veiksmažodis (laikyti arba manyti) arba jungtukas ('bet greičiau'). Čia reiškia manyti. <b>Sinonimas:</b> mano/tiki. <b>Pavyzdys:</b> Jis <b>mano</b>, kad rytoj lis.",
            "no": "<b>Norska (Norsk):</b> <b>Forklaring:</b> Har flere betydninger. Kan være verb i nåtid (å holde noe, eller å tenke/tro) og kan være en konjunksjon (men heller). Her betyr det å tro. <b>Synonym:</b> tror / mener. <b>Eksempel:</b> Han <b>tror</b> det vil regne i morgen.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> <b>توضیح:</b> می‌تواند معانی متعددی داشته باشد. می‌تواند فعل (نگه داشتن، یا فکر کردن) و می‌تواند یک حرف ربط باشد (بلکه). در اینجا به معنی فکر کردن است. <b>مترادف:</b> باور دارد / فکر می‌کند. <b>مثال:</b> او <b>فکر می‌کند</b> فردا باران می‌بارد.</div>",
            "pt": "<b>Portúgalska (Português):</b> <b>Explicação:</b> Pode ter vários significados. Pode ser um verbo no presente (segurar, ou pensar) e pode ser uma conjunção ('mas sim'). Aqui significa pensar. <b>Sinônimo:</b> acha / acredita. <b>Exemplo:</b> Ele <b>acha (pensa)</b> que vai chover amanhã.",
            "pl": "<b>Pólska (Polski):</b> <b>Wyjaśnienie:</b> Może mieć wiele znaczeń. Może być czasownikiem w czasie teraźniejszym (trzymać lub myśleć) oraz spójnikiem ('lecz/raczej'). Tutaj oznacza myśleć. <b>Synonim:</b> uważa / wierzy. <b>Przykład:</b> On <b>myśli</b>, że jutro będzie padać.",
            "ro": "<b>Rúmenska (Română):</b> <b>Explicație:</b> Poate avea mai multe sensuri. Poate fi un verb la prezent (a ține, sau a crede) și poate fi o conjuncție ('ci mai degrabă'). Aici înseamnă a crede. <b>Sinonim:</b> crede / gândește. <b>Exemplu:</b> El <b>crede</b> că va ploua mâine.",
            "ru": "<b>Rússneska (Русский):</b> <b>Объяснение:</b> Имеет несколько значений. Может быть глаголом в настоящем времени (держать или думать) или союзом ('а/но скорее'). Здесь это означает думать. <b>Синоним:</b> думает / верит. <b>Пример:</b> Он <b>думает</b>, что завтра будет дождь.",
            "es": "<b>Spænska (Español):</b> <b>Explicación:</b> Puede tener múltiples significados. Puede ser un verbo en presente (sostener, o pensar) y puede ser una conjunción ('sino'). Aquí significa pensar. <b>Sinónimo:</b> cree / piensa. <b>Ejemplo:</b> Él <b>piensa</b> que lloverá mañana.",
            "sv": "<b>Sænska (Svenska):</b> <b>Förklaring:</b> Kan ha flera betydelser. Det kan vara verb i nutid (att hålla, eller att tro) och det kan vara en konjunktion (utan/hellre). Här betyder det att tro. <b>Synonym:</b> tror / anser. <b>Exempel:</b> Han <b>tror</b> att det regnar imorgon.",
            "th": "<b>Tælenska (ภาษาไทย):</b> <b>คำอธิบาย:</b> สามารถมีความหมายได้หลายแบบ อาจเป็นกริยา (ถือ, หรือคิด) และอาจเป็นคำสันธาน ('แต่ค่อนข้าง') ในที่นี้หมายถึงคิด <b>คำพ้องความหมาย:</b> เชื่อว่า / คิดว่า <b>ตัวอย่าง:</b> เขา<b>คิด</b>ว่าพรุ่งนี้ฝนจะตก",
            "uk": "<b>Úkraínska (Українська):</b> <b>Пояснення:</b> Може мати кілька значень. Може бути дієсловом (тримати або думати) і може бути сполучником ('але швидше'). Тут означає думати. <b>Синонім:</b> вірить / думає. <b>Приклад:</b> Він <b>думає</b>, що завтра буде дощ.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> <b>Giải thích:</b> Có thể có nhiều nghĩa. Nó có thể là một động từ (cầm, hoặc nghĩ) và nó có thể là một liên từ ('mà thay vào đó'). Ở đây nó có nghĩa là suy nghĩ. <b>Từ đồng nghĩa:</b> tin / nghĩ. <b>Ví dụ:</b> Anh ấy <b>nghĩ</b> ngày mai trời sẽ mưa.",
            "de": "<b>Þýska (Deutsch):</b> <b>Erklärung:</b> Kann mehrere Bedeutungen haben. Es kann ein Präsensverb (halten oder denken) und eine Konjunktion ('sondern') sein. Hier bedeutet es denken. <b>Synonym:</b> glaubt / denkt. <b>Beispiel:</b> Er <b>denkt</b>, dass es morgen regnet."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false; 

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Námsorð: 1 - 10 algengustu.</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
                <option value="de">Þýska – Deutsch</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
        <div class="feedback-note">
            Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Námsorð: 1 - 10 algengustu.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
