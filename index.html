<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Námsorð: 1 - 10 algengustu.</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Námsorð: 1 - 10 algengustu.</h1>

        <div id="progress-bar"></div>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

            "lt": "<b>Litháíska (Lietuvių):</b><br><br><b>Paaiškinimas:</b> Kelios reikšmės: laikyti (veiksmažodis), manyti/tikėti (veiksmažodis), arba jungtukas (bet greičiau).<br><br><b>Sinonimas:</b> tiki, galvoja, arba (kaip jungtukas) bet.<br><br><b>1. (Laikyti):</b> Jis <b>laiko</b> maišą.<br><b>2. (Manyti):</b> Ji <b>mano</b>, kad lis.<br><b>3. (Bet greičiau/o):</b> Nenoriu arbatos, <b>o</b> kavos.",
            "no": "<b>Norska (Norsk):</b><br><br><b>Forklaring:</b> Har flere betydninger: å holde noe (verb), å tro/tenke (verb), eller konjunksjon (men heller).<br><br><b>Synonym:</b> mener, tenker, eller (som konjunksjon) men.<br><br><b>1. (Å holde):</b> Han <b>holder</b> en pose.<br><b>2. (Å tro):</b> Hun <b>tror</b> det regner.<br><b>3. (Men heller):</b> Jeg vil ikke ha te, <b>men heller</b> kaffe.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><br><b>توضیح:</b> معانی متعددی دارد: نگه داشتن (فعل)، فکر کردن/باور داشتن (فعل)، یا حرف ربط (بلکه).<br><br><b>مترادف:</b> باور دارد، فکر می‌کند، یا (به عنوان حرف ربط) بلکه.<br><br><b>1. (نگه داشتن):</b> او یک کیسه در دست <b>دارد</b>.<br><b>2. (فکر کردن):</b> او <b>فکر می‌کند</b> باران می‌بارد.<br><b>3. (بلکه):</b> من چای نمی‌خواهم، <b>بلکه</b> قهوه می‌خواهم.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><br><b>Explicação:</b> Tem vários significados: segurar (verbo), pensar/acreditar (verbo), ou conjunção (mas sim).<br><br><b>Sinônimo:</b> crê, pensa, ou (como conjunção) mas.<br><br><b>1. (Segurar):</b> Ele <b>segura</b> um saco.<br><b>2. (Pensar):</b> Ela <b>acha</b> que vai chover.<br><b>3. (Mas sim):</b> Não quero chá, <b>mas sim</b> café.",
            "pl": "<b>Pólska (Polski):</b><br><br><b>Wyjaśnienie:</b> Wiele znaczeń: trzymać (czasownik), myśleć/wierzyć (czasownik), lub spójnik (lecz/raczej).<br><br><b>Synonim:</b> uważa, myśli, lub (jako spójnik) lecz.<br><br><b>1. (Trzymać):</b> On <b>trzyma</b> torbę.<br><b>2. (Myśleć):</b> Ona <b>myśli</b>, że będzie padać.<br><b>3. (Lecz/Zamiast):</b> Nie chcę herbaty, <b>lecz</b> kawę.",
            "ro": "<b>Rúmenska (Română):</b><br><br><b>Explicație:</b> Mai multe sensuri: a ține (verb), a crede/gândi (verb), sau conjuncție (ci).<br><br><b>Sinonim:</b> crede, gândește, sau (ca și conjuncție) ci.<br><br><b>1. (A ține):</b> El <b>ține</b> o pungă.<br><b>2. (A crede):</b> Ea <b>crede</b> că va ploua.<br><b>3. (Ci/Mai degrabă):</b> Nu vreau ceai, <b>ci</b> cafea.",
            "ru": "<b>Rússneska (Русский):</b><br><br><b>Объяснение:</b> Несколько значений: держать (глагол), думать/считать (глагол), или союз (а/но скорее).<br><br><b>Синоним:</b> верит, думает, или (как союз) но/а.<br><br><b>1. (Держать):</b> Он <b>держит</b> пакет.<br><b>2. (Думать):</b> Она <b>думает</b>, что пойдет дождь.<br><b>3. (А/Но):</b> Я не хочу чай, <b>а (скорее)</b> кофе.",
            "es": "<b>Spænska (Español):</b><br><br><b>Explicación:</b> Múltiples significados: sostener (verbo), pensar/creer (verbo), o conjunción (sino).<br><br><b>Sinónimo:</b> cree, piensa, o (como conjunción) sino.<br><br><b>1. (Sostener):</b> Él <b>sostiene</b> una bolsa.<br><b>2. (Pensar):</b> Ella <b>piensa</b> que lloverá.<br><b>3. (Sino):</b> No quiero té, <b>sino</b> café.",
            "sv": "<b>Sænska (Svenska):</b><br><br><b>Förklaring:</b> Flera betydelser: att hålla (verb), att tro (verb), eller konjunktion (utan).<br><br><b>Synonym:</b> anser, tänker, eller (som konjunktion) utan.<br><br><b>1. (Att hålla):</b> Han <b>håller</b> en påse.<br><b>2. (Att tro):</b> Hon <b>tror</b> att det regnar.<br><b>3. (Utan/Istället):</b> Jag vill inte ha te, <b>utan</b> kaffe.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><br><b>คำอธิบาย:</b> มีหลายความหมาย: ถือ/จับ (กริยา), คิด/เชื่อ (กริยา), หรือคำสันธาน (แต่ค่อนข้าง/แทน)<br><br><b>คำพ้องความหมาย:</b> เชื่อว่า, คิดว่า, หรือ (เป็นคำสันธาน) แต่<br><br><b>1. (ถือ):</b> เขา<b>ถือ</b>ถุง<br><b>2. (คิดว่า):</b> เธอ<b>คิดว่า</b>ฝนจะตก<br><b>3. (แต่คือ/แทน):</b> ฉันไม่ต้องการชา <b>แต่คือ</b>กาแฟ",
            "uk": "<b>Úkraínska (Українська):</b><br><br><b>Пояснення:</b> Кілька значень: тримати (дієслово), думати/вважати (дієслово), або сполучник (але/швидше).<br><br><b>Синонім:</b> вірить, думає, або (як сполучник) але/а.<br><br><b>1. (Тримати):</b> Він <b>тримає</b> пакет.<br><b>2. (Думати):</b> Вона <b>думає</b>, що піде дощ.<br><b>3. (Але/Швидше):</b> Я не хочу чай, <b>а швидше</b> каву.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><br><b>Giải thích:</b> Có nhiều nghĩa: cầm/giữ (động từ), nghĩ/tin (động từ), hoặc liên từ (mà thay vào đó).<br><br><b>Từ đồng nghĩa:</b> tin rằng, nghĩ rằng, hoặc (như một liên từ) mà.<br><br><b>1. (Cầm/Giữ):</b> Anh ấy <b>cầm</b> một cái túi.<br><b>2. (Nghĩ):</b> Cô ấy <b>nghĩ</b> trời sẽ mưa.<br><b>3. (Mà là/Thay vì):</b> Tôi không muốn trà, <b>mà là</b> cà phê.",
            "de": "<b>Þýska (Deutsch):</b><br><br><b>Erklärung:</b> Mehrere Bedeutungen: halten (Verb), denken/glauben (Verb) oder Konjunktion (sondern).<br><br><b>Synonym:</b> glaubt, denkt, oder (als Konjunktion) sondern.<br><br><b>1. (Halten):</b> Er <b>hält</b> eine Tüte.<br><b>2. (Denken):</b> Sie <b>denkt</b>, dass es regnet.<br><b>3. (Sondern):</b> Ich will keinen Tee, <b>sondern</b> Kaffee."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false; 

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Námsorð: 1 - 10 algengustu.</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
                <option value="de">Þýska – Deutsch</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
        <div class="feedback-note">
            Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Námsorð: 1 - 10 algengustu.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
